{% extends "documents/base.html" %}
{% block content %}

<div class="container">
    <h3 class="text-center mb-3">Document Viewer</h3>

    <div id="doc-container"></div>

    <div id="loader" class="text-center my-3">
        <div class="spinner-border text-primary"></div>
        <p>Loading...</p>
    </div>
</div>

<style>
#doc-container img {
    width: 100%;
    max-width: 900px;
    display: block;
    margin: 20px auto;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

body {
    background: #f5f7fb;
}
</style>

<script>
let page = 1;
let loading = false;
let endReached = false;
const docId = "{{ doc_id }}";

document.addEventListener("contextmenu", e => e.preventDefault());

function loadNextPage() {
    if (loading || endReached) return;

    loading = true;

    fetch(`/secure-document/${docId}/page/${page}/`)
    .then(res => {
        if (!res.ok) {
            endReached = true;
            document.getElementById("loader").innerHTML = "<p>End of Document</p>";
            return;
        }
        return res.json();
    })
    .then(data => {
        if (!data) return;

        const img = document.createElement("img");
        img.src = "data:image/png;base64," + data.image;

        document.getElementById("doc-container").appendChild(img);
        page++;
        loading = false;
    });
}

window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
        loadNextPage();
    }
});

document.addEventListener("DOMContentLoaded", loadNextPage);

window.addEventListener("beforeunload", function () {
    navigator.sendBeacon("/log-close/{{ doc_id }}/");
});
</script>

{% endblock %}
