{% extends "admin/base.html" %}
{% block content %}

<div class="container-fluid px-0">
    <h4 class="text-center mb-3">Document Viewer</h4>

    <div id="pdf-container"></div>
</div>

<style>

#pdf-container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    background: white;
}

canvas {
    max-width: 100%;
    height: auto !important;
    display: block;
    margin: 0 auto 5px auto;
    background: white;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", function(e){
    if (e.ctrlKey && e.key === "s") e.preventDefault();
    if (e.ctrlKey && e.key === "p") e.preventDefault();
    if (e.ctrlKey && e.key === "u") e.preventDefault();
});

document.addEventListener("dragstart", e => e.preventDefault());

document.addEventListener("DOMContentLoaded", function(){

    const url = "{% url 'stream_document' doc_id %}";
    const container = document.getElementById("pdf-container");

    pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    function renderPDF(){

        container.innerHTML = "";

        pdfjsLib.getDocument(url).promise.then(function(pdf){

            for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){

                pdf.getPage(pageNum).then(function(page){

                    const containerWidth = container.clientWidth;

                    const viewport = page.getViewport({scale:1});

                    const scale = containerWidth / viewport.width;

                    const scaledViewport = page.getViewport({scale:scale});

                    const canvas = document.createElement("canvas");

                    const context = canvas.getContext("2d");

                    const outputScale = window.devicePixelRatio || 1;

                    canvas.width = scaledViewport.width * outputScale;
                    canvas.height = scaledViewport.height * outputScale;

                    canvas.style.width = scaledViewport.width + "px";
                    canvas.style.height = scaledViewport.height + "px";

                    context.setTransform(outputScale,0,0,outputScale,0,0);

                    container.appendChild(canvas);

                    page.render({
                        canvasContext: context,
                        viewport: scaledViewport
                    });

                });

            }

        });

    }

    renderPDF();

    window.addEventListener("resize", renderPDF);

});

</script>

{% endblock %}
